# Solo en local, encima de compose.demo.yaml: construye la imagen desde el código y
# pone delante del panel un proxy que hace de Authentik. El staging no lo usa.
#
# La app no tiene ningún modo que se salte la identidad: el panel sigue aceptando la
# cabecera solo si la conexión viene de MM_TRUSTED_PROXIES, que aquí es el proxy y
# nada más. El panel deja de publicar su puerto; solo se llega por el proxy, en
# 127.0.0.1.

x-build: &build
  build: .
  pull_policy: build

services:
  demo-seed: *build
  worker: *build
  api: *build
  public: *build

  panel:
    <<: *build
    ports: !reset []
    environment:
      MM_TRUSTED_PROXIES: '["172.31.251.10/32"]'
      MM_PANEL_ALLOWED_USERS: '["demo"]'
    networks: [default, demo-auth]

  panel-auth:
    image: ${NGINX_IMAGE:?}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${DEMO_PANEL_PORT:-8002}:8080"]
    volumes:
      - ./deploy/demo/panel-auth.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      demo-auth:
        ipv4_address: 172.31.251.10
    depends_on: [panel]

networks:
  demo-auth:
    ipam:
      config:
        - subnet: 172.31.251.0/24
