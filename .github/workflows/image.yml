name: Tests e imagen

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests, tipos y auditoría
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: ffmpeg para los vídeos sintéticos de los tests
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Dependencias
        run: uv sync --frozen

      - name: Tipos
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: Auditoría de dependencias
        run: uv run pip-audit

  demo:
    name: Modo demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Arrancar
        run: ./demo.sh up -d --build

      - name: healthz con los cuatro chequeos en verde
        run: |
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8003/healthz > health.json && break
            sleep 2
          done
          cat health.json
          jq -e '.ok and .media.ok and .jellyfin_ids_export.ok and .jellyfin.ok and .worker.ok' health.json

      - name: Panel a través del proxy de cabeceras
        run: curl -fsS -o /dev/null http://127.0.0.1:8002/

      - name: Manifiesto igual al esperado, clip a clip
        run: |
          for _ in $(seq 30); do
            [ -f demo-data/manifest/buceo.json ] && break
            sleep 2
          done
          ./demo.sh run --rm --no-deps -v "$PWD/deploy/demo:/expected:ro" worker \
            compare /manifest/buceo.json /expected/manifest.expected.json

      - name: Logs
        if: failure()
        run: ./demo.sh logs

  build:
    name: Build, scan y push
    needs: [checks, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login a ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build imagen (local, para scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Instalar Trivy v0.71.0
        run: |
          TRIVY_SHA256="30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz" \
            -O /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Trivy — informe completo (no bloquea)
        run: trivy image --exit-code 0 --severity HIGH,CRITICAL --vuln-type os,library "$IMAGE"

      - name: Trivy (puerta)
        run: trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --vuln-type os,library "$IMAGE"

      - name: Push imagen
        run: docker push "$IMAGE"
