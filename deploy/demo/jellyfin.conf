# Jellyfin falso del modo demo: /System/Info/Public para el healthz y la miniatura de
# cada ID que ha dejado la siembra.
server {
    listen 8080;
    server_tokens off;
    access_log off;

    location = /System/Info/Public {
        default_type application/json;
        return 200 '{"ServerName":"jellyfin-demo","ProductName":"Jellyfin Server","Id":"demo"}';
    }

    location ~ "^/Items/([0-9a-f]{32})/Images/Primary$" {
        root /images;
        try_files /$1.jpg =500;
    }

    # Jellyfin contesta 500, no 404, a un ID que no existe.
    location / {
        return 500;
    }
}
