# Hace de outpost de Authentik en local: todo el que llega a 127.0.0.1 es "demo".
server {
    listen 8080;
    server_tokens off;
    access_log off;

    location / {
        proxy_pass http://panel:8002;
        # El panel compara el Origin del formulario con el Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-authentik-username demo;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
    }
}
