# Raíces del modo demo: las mismas que deploy/roots.example.toml, con la ruta de
# Jellyfin inventada (el Jellyfin falso no la mira; solo sale en el export de IDs y en
# el manifiesto).

[[roots]]
name = "buceo"
path = "/media/buceo"
shareable = true
deletable = true
renamable = false
synced = true
requires_second_copy = true
indexed_by_jellyfin = true
jellyfin_path = "/biblioteca/buceo"
in_manifest = true
metadata_profile = "dji"

[[roots]]
name = "originales-120fps"
path = "/media/originales-120fps"
shareable = true
deletable = true
renamable = false
synced = true
requires_second_copy = true
metadata_profile = "dji"
thumbnail_from = "buceo"

[[roots]]
name = "send"
path = "/media/send"
shareable = true
deletable = true
renamable = true
metadata_profile = "generic"
